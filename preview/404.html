    <style>
      body {
        margin: 0;
        background-color: #FCFBF7;
        color: #18231F;
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .error-container {
        flex: 1;

        padding: 80px 24px;

      .error-badge {

      }
      .error-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 64px;
        font-weight: 500;
        margin: 0 0 20px 0;
        line-height: 1.1;
      }
      .error-subtext {
        font-size: 16px;
        color: #5C6B61;
        max-width: 480px;
        line-height: 1.6;
        margin: 0 0 36px 0;
      }
      .error-btn {
        display: inline-block;
        background-color: #18231F;
        color: #FCFBF7;
        padding: 16px 36px;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 600;
        text-decoration: none;
        border-radius: 4px;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }
      .error-btn:hover {
        background-color: #B9784D;
        transform: translateY(-2px);
